name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.ENABLE_AWS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t "$ECR_REPOSITORY:$GITHUB_SHA" .
          docker tag "$ECR_REPOSITORY:$GITHUB_SHA" "$ECR_REPOSITORY:latest"
          docker push "$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REPOSITORY:latest"
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
