name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.ENABLE_AWS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t "$ECR_REPOSITORY:$GITHUB_SHA" .
          docker tag "$ECR_REPOSITORY:$GITHUB_SHA" "$ECR_REPOSITORY:latest"
          docker push "$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REPOSITORY:latest"
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
      - name: Deploy API (ECS or AWS Lambda)
        run: |
          if [ -n "$API_LAMBDA" ]; then
            echo "Deploying to AWS Lambda serverless target..."
            
            # 1. Run Prisma database migrations
            echo "Running Prisma migrations..."
            aws lambda invoke --function-name "$MIGRATION_LAMBDA" response.json
            cat response.json
            if grep -q "FunctionError" response.json; then
              echo "Error: Database migrations failed!"
              exit 1
            fi
            
            # 2. Update API Lambda code with new ECR image
            echo "Updating Lambda function code..."
            aws lambda update-function-code \
              --function-name "$API_LAMBDA" \
              --image-uri "$ECR_REPOSITORY:$GITHUB_SHA"
            
            # 3. Wait for Lambda update to complete
            aws lambda wait function-updated-v2 \
              --function-name "$API_LAMBDA"
          else
            echo "Deploying to AWS ECS Fargate target..."
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force-new-deployment
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE"
          fi
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          API_LAMBDA: ${{ vars.API_LAMBDA_FUNCTION_NAME }}
          MIGRATION_LAMBDA: ${{ vars.MIGRATION_LAMBDA_FUNCTION_NAME }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
