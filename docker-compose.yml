services:
  mysql:
    image: mysql:8.4
    container_name: smoke-tracker-mysql
    environment:
      MYSQL_DATABASE: smoke_tracker
      MYSQL_USER: smoke
      MYSQL_PASSWORD: smoke
      MYSQL_ROOT_PASSWORD: smoke_root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usmoke", "-psmoke"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: smoke-tracker-adminer
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mysql-data:
